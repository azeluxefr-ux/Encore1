<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#09090f">
  <title>Encore 1</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="app">

  <!-- MENU -->
  <section id="menu" class="screen active">
    <div class="logo">ENCORE <span>1</span></div>

    <p class="tagline">
      Un clic. Un choix. Encore une fois.
    </p>

    <button id="playBtn" class="main-btn">
      JOUER
    </button>

    <p class="best-label">
      MEILLEUR SCORE
      <strong id="menuBest">0</strong>
    </p>
  </section>


  <!-- JEU -->
  <section id="game" class="screen">

    <header class="hud">

      <div>
        <small>SCORE</small>
        <strong id="score">0</strong>
      </div>

      <div class="combo">
        <small>COMBO</small>
        <strong id="combo">x1</strong>
      </div>

      <div>
        <small>RECORD</small>
        <strong id="best">0</strong>
      </div>

    </header>


    <div id="arena">

      <div id="message" class="message"></div>

      <button id="target" aria-label="Cible"></button>

    </div>


    <div class="progress-wrap">
      <div id="progress"></div>
    </div>

    <p class="hint">
      Touche la cible avant qu'elle disparaisse.
    </p>

  </section>


  <!-- GAME OVER -->
  <section id="gameOver" class="screen">

    <p class="over-title">
      FIN DE PARTIE
    </p>

    <div class="final-score" id="finalScore">
      0
    </div>

    <p class="record" id="newRecord">
      RECORD
    </p>

    <button id="againBtn" class="main-btn">
      ENCORE !
    </button>

    <button id="menuBtn" class="secondary-btn">
      MENU
    </button>

  </section>

</main>

<script src="game.js"></script>

</body>
</html>
